<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Original illustration: a cricket ground under floodlights at night (fallback when no photo is supplied). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060914"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#FFF1C2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFF1C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="field" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#2f6b3c"/>
      <stop offset="1" stop-color="#132a1c"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- distant hills -->
  <path d="M0 560 L180 500 L320 540 L520 470 L700 530 L900 480 L1080 540 L1280 490 L1440 530 L1600 500 V620 H0 Z" fill="#0d1526"/>
  <!-- stands -->
  <path d="M0 610 Q800 520 1600 610 V680 H0 Z" fill="#141C31"/>
  <path d="M0 640 Q800 560 1600 640" stroke="#24304f" stroke-width="3" fill="none"/>
  <!-- ground -->
  <ellipse cx="800" cy="840" rx="980" ry="260" fill="url(#field)"/>
  <g opacity="0.12" fill="#0b1f12">
    <ellipse cx="800" cy="840" rx="860" ry="215"/>
    <ellipse cx="800" cy="840" rx="700" ry="170" fill="#3d8a4f"/>
  </g>
  <rect x="770" y="700" width="60" height="200" fill="#b9a77a" opacity="0.55"/>
  <!-- floodlight beams -->
  <path d="M180 170 L60 760 L460 760 Z" fill="url(#beam)"/>
  <path d="M1420 170 L1140 760 L1540 760 Z" fill="url(#beam)"/>
  <path d="M560 230 L480 720 L760 720 Z" fill="url(#beam)" opacity="0.6"/>
  <path d="M1040 230 L840 720 L1120 720 Z" fill="url(#beam)" opacity="0.6"/>
  <!-- towers -->
  <g stroke="#1d2740" stroke-width="10">
    <line x1="180" y1="200" x2="200" y2="640"/>
    <line x1="1420" y1="200" x2="1400" y2="640"/>
    <line x1="560" y1="250" x2="570" y2="600"/>
    <line x1="1040" y1="250" x2="1030" y2="600"/>
  </g>
  <g fill="#e9e3c9">
    <rect x="130" y="150" width="100" height="44" rx="4"/>
    <rect x="1370" y="150" width="100" height="44" rx="4"/>
    <rect x="525" y="215" width="70" height="32" rx="3"/>
    <rect x="1005" y="215" width="70" height="32" rx="3"/>
  </g>
  <circle cx="180" cy="172" r="190" fill="url(#glow)"/>
  <circle cx="1420" cy="172" r="190" fill="url(#glow)"/>
  <circle cx="560" cy="231" r="120" fill="url(#glow)" opacity="0.8"/>
  <circle cx="1040" cy="231" r="120" fill="url(#glow)" opacity="0.8"/>
</svg>
