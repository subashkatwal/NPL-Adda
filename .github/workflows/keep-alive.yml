# Pings the API health check so Render's free web service never idles into sleep (it sleeps after
# ~15 minutes without traffic). The health check does not touch the database, so Neon can still scale to zero.
# GitHub may delay scheduled runs and disables them after 60 days without repository activity.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 \
            https://npl-adda-api.onrender.com/api/v1/health
