# Render blueprint: the Django API (free Docker web service) and the Vite frontend (free static site).
# Postgres lives on Neon, Redis on Upstash and images on Cloudinary (all free); fill the sync:false values
# in the Render dashboard. If Render gives the services different URLs, update the hosts below.
services:
  - type: web
    name: npl-adda-api
    runtime: docker
    plan: free
    region: singapore  # same region as the Neon database (AWS Asia Pacific 1)
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: npl-adda-api.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://npl-adda.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://npl-adda.onrender.com
      - key: DJANGO_SERVE_MEDIA
        value: "True"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "4"
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: POSTGRES_SSLMODE
        value: require
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # The SPA proxies /api and /media to the API, so the browser sees one origin and session/CSRF cookies work.
  - type: web
    name: npl-adda
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://npl-adda-api.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://npl-adda-api.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
